[project]
name = "weasyprint-bundled-builder"
version = "26.1.1"
description = "Build platform-specific WeasyPrint wheels with bundled native libraries"
requires-python = ">=3.13"
license = "MIT"

[dependency-groups]
native-build = [
    "meson>=1.8,<2",
    "ninja>=1.12",
    "zstandard>=0.23",
]
[tool.uv]
package = false
default-groups = ["native-build"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".test-venv",
    ".venv",
    "_build",
    "dist",
    "downloads",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
