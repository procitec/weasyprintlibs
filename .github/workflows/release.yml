name: Build, test and release wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v26.1.1
        required: true
        type: string
      weasyprint_version:
        description: Upstream WeasyPrint version
        required: true
        default: "69.0"
        type: string
      draft:
        description: Create the GitHub release as a draft
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-wheels-${{ github.ref }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  DEFAULT_WEASYPRINT_VERSION: "69.0"
  TEST_PYTHON_VERSION: "3.13"

jobs:
  linux-wheel:
    name: Linux manylinux_2_28 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Build manylinux image
        run: |
          test -f uv.lock
          docker build \
            --file containers/Dockerfile.manylinux_2_28 \
            --tag weasyprint-bundled-manylinux:release \
            .
      - name: Build wheel
        env:
          WEASYPRINT_VERSION: ${{ inputs.weasyprint_version || '69.0' }}
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/io" \
            --workdir /io \
            --env UV_CACHE_DIR=/io/.uv-cache \
            --env WEASYPRINT_VERSION \
            weasyprint-bundled-manylinux:release \
            bash -lc 'uv sync --frozen && uv run python -m scripts build --version "${WEASYPRINT_VERSION}" --profile x86_64'
      - uses: actions/upload-artifact@v7
        with:
          name: weasyprint-manylinux-2-28-x86-64
          path: |
            dist/weasyprint-*.whl
            dist/third-party-licenses-*.zip
          if-no-files-found: error

  windows-wheel:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Require lockfiles
        shell: pwsh
        run: |
          if (-not (Test-Path uv.lock)) { throw "uv.lock is missing" }
          if (-not (Test-Path config/windows-packages.lock.toml)) {
            throw "config/windows-packages.lock.toml is missing"
          }
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build wheel
        shell: pwsh
        env:
          WEASYPRINT_VERSION: ${{ inputs.weasyprint_version || '69.0' }}
        run: |
          uv sync --frozen
          just build $env:WEASYPRINT_VERSION x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: weasyprint-windows-x86-64
          path: |
            dist/weasyprint-*.whl
            dist/third-party-licenses-*.zip
          if-no-files-found: error

  macos-wheel:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - name: Install just
        uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Homebrew build libraries
        run: |
          brew untap aws/tap || true
          brew install pango
      - name: Build wheel
        env:
          WEASYPRINT_VERSION: ${{ inputs.weasyprint_version || '69.0' }}
        run: |
          uv sync --frozen
          just build "${WEASYPRINT_VERSION}" x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: weasyprint-macos-${{ matrix.arch }}
          path: |
            dist/weasyprint-*.whl
            dist/third-party-licenses-*.zip
          if-no-files-found: error

  test-ubuntu:
    name: Test Ubuntu 24.04
    needs: linux-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: weasyprint-manylinux-2-28-x86-64
          path: wheelhouse
      - name: Test wheel
        run: |
          uv python install "${TEST_PYTHON_VERSION}"
          uv venv --python "${TEST_PYTHON_VERSION}" .test-venv
          uv pip install --python .test-venv/bin/python \
            wheelhouse/weasyprint-*.whl "pytest>=8,<9" "pypdf>=6,<7"
          .test-venv/bin/python -m pytest \
            tests/ -v -s

  test-rocky:
    name: Test Rocky Linux ${{ matrix.rocky }}
    needs: linux-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rocky: ["8", "9"]
    container:
      image: rockylinux:${{ matrix.rocky }}
    steps:
      - name: Install prerequisites
        run: dnf install -y ca-certificates tar gzip findutils dejavu-sans-fonts
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: weasyprint-manylinux-2-28-x86-64
          path: wheelhouse
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "/root/.local/bin" >> "$GITHUB_PATH"
      - name: Test wheel
        run: |
          export PATH="/root/.local/bin:${PATH}"
          uv python install "${TEST_PYTHON_VERSION}"
          uv venv --python "${TEST_PYTHON_VERSION}" .test-venv
          uv pip install --python .test-venv/bin/python \
            wheelhouse/weasyprint-*.whl "pytest>=8,<9" "pypdf>=6,<7"
          .test-venv/bin/python -m pytest \
            tests/ -v -s

  test-windows:
    name: Test Windows x86_64
    needs: windows-wheel
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: weasyprint-windows-x86-64
          path: wheelhouse
      - name: Test wheel
        shell: pwsh
        run: |
          uv python install $env:TEST_PYTHON_VERSION
          uv venv --python $env:TEST_PYTHON_VERSION .test-venv
          $wheel = Get-ChildItem wheelhouse\weasyprint-*.whl | Select-Object -First 1
          uv pip install --python .test-venv\Scripts\python.exe `
            $wheel.FullName "pytest>=8,<9" "pypdf>=6,<7"
          .test-venv\Scripts\python.exe -m pytest `
            tests -v -s

  test-macos:
    name: Test macOS ${{ matrix.arch }}
    needs: macos-wheel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: weasyprint-macos-${{ matrix.arch }}
          path: wheelhouse
      - name: Install and test wheel
        run: |
          uv python install "${TEST_PYTHON_VERSION}"
          uv venv --python "${TEST_PYTHON_VERSION}" .test-venv
          uv pip install --python .test-venv/bin/python \
            wheelhouse/weasyprint-*.whl "pytest>=8,<9" "pypdf>=6,<7"
          for formula in pango cairo fontconfig glib harfbuzz freetype; do
            brew unlink "${formula}" >/dev/null 2>&1 || true
          done
          .test-venv/bin/python -m pytest \
            tests/ -v -s

  release:
    name: Create GitHub release
    needs:
      - linux-wheel
      - windows-wheel
      - macos-wheel
      - test-ubuntu
      - test-rocky
      - test-windows
      - test-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: weasyprint-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        run: |
          find release-assets -maxdepth 1 -name 'weasyprint-*.whl' -print
          find release-assets -maxdepth 1 -name 'third-party-licenses-*.zip' -print
          test "$(find release-assets -maxdepth 1 -name 'weasyprint-*.whl' | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -name 'third-party-licenses-*.zip' | wc -l)" -eq 4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          release_tag="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME}}"
          args=(
            release create "${release_tag}"
            release-assets/*.whl
            release-assets/third-party-licenses-*.zip
            --target "${GITHUB_SHA}"
            --generate-notes
            --title "${release_tag}"
          )
          if [[ "${INPUT_DRAFT:-false}" == "true" ]]; then
            args+=(--draft)
          fi
          gh "${args[@]}"
