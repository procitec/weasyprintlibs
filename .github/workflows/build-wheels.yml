name: Build wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      weasyprint_version:
        description: Upstream WeasyPrint version
        required: true
        default: "69.0"
        type: string

permissions:
  contents: read

concurrency:
  group: build-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_WEASYPRINT_VERSION: "69.0"
  TEST_PYTHON_VERSION: "3.13"

jobs:
  linux-wheel:
    name: Linux manylinux_2_28 x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Require committed uv lock
        run: test -f uv.lock
      - name: Build manylinux image
        run: |
          docker build \
            --file containers/Dockerfile.manylinux_2_28 \
            --tag weasyprint-bundled-manylinux:ci \
            .
      - name: Build bundled WeasyPrint wheel
        env:
          INPUT_WEASYPRINT_VERSION: ${{ inputs.weasyprint_version }}
        run: |
          version="${INPUT_WEASYPRINT_VERSION:-${DEFAULT_WEASYPRINT_VERSION}}"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/io" \
            --workdir /io \
            --env UV_CACHE_DIR=/io/.uv-cache \
            --env WEASYPRINT_VERSION="${version}" \
            weasyprint-bundled-manylinux:ci \
            bash -lc 'uv sync --frozen && make wheel WEASYPRINT_VERSION="${WEASYPRINT_VERSION}"'
      - uses: actions/upload-artifact@v7
        with:
          name: weasyprint-manylinux-2-28-x86-64
          path: dist/weasyprint-*.whl
          if-no-files-found: error
          retention-days: 14

  windows-wheel:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Require committed lockfiles
        shell: pwsh
        run: |
          if (-not (Test-Path uv.lock)) { throw "uv.lock is missing" }
          if (-not (Test-Path config/windows-packages.lock.toml)) {
            throw "config/windows-packages.lock.toml is missing"
          }
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build bundled WeasyPrint wheel
        shell: pwsh
        env:
          INPUT_WEASYPRINT_VERSION: ${{ inputs.weasyprint_version }}
        run: |
          $version = $env:INPUT_WEASYPRINT_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = $env:DEFAULT_WEASYPRINT_VERSION
          }
          ./scripts/build_windows.ps1 -WeasyPrintVersion $version -Profile x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: weasyprint-windows-x86-64
          path: dist/weasyprint-*.whl
          if-no-files-found: error
          retention-days: 14

  macos-wheel:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Homebrew build libraries
        run: |
          brew untap aws/tap || true
          brew install pango
      - name: Build bundled WeasyPrint wheel
        env:
          INPUT_WEASYPRINT_VERSION: ${{ inputs.weasyprint_version }}
        run: |
          export WEASYPRINT_VERSION="${INPUT_WEASYPRINT_VERSION:-${DEFAULT_WEASYPRINT_VERSION}}"
          ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: weasyprint-macos-${{ matrix.arch }}
          path: dist/weasyprint-*.whl
          if-no-files-found: error
          retention-days: 14

  test-ubuntu:
    name: Test Ubuntu 24.04
    needs: linux-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: weasyprint-manylinux-2-28-x86-64
          path: wheelhouse
      - name: Install and test wheel
        run: |
          uv python install "${TEST_PYTHON_VERSION}"
          uv venv --python "${TEST_PYTHON_VERSION}" .test-venv
          uv pip install --python .test-venv/bin/python \
            wheelhouse/weasyprint-*.whl "pytest>=8,<9" "pypdf>=6,<7"
          .test-venv/bin/python -m pytest \
            tests/ -v -s
      - name: Upload test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-pdf-ubuntu
          path: tests/**/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  test-rocky:
    name: Test Rocky Linux ${{ matrix.rocky }}
    needs: linux-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rocky: ["8", "9"]
    container:
      image: rockylinux:${{ matrix.rocky }}
    steps:
      - name: Install prerequisites
        run: dnf install -y ca-certificates curl tar gzip findutils dejavu-sans-fonts
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: weasyprint-manylinux-2-28-x86-64
          path: wheelhouse
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "/root/.local/bin" >> "$GITHUB_PATH"
      - name: Install and test wheel
        run: |
          export PATH="/root/.local/bin:${PATH}"
          uv python install "${TEST_PYTHON_VERSION}"
          uv venv --python "${TEST_PYTHON_VERSION}" .test-venv
          uv pip install --python .test-venv/bin/python \
            wheelhouse/weasyprint-*.whl "pytest>=8,<9" "pypdf>=6,<7"
          .test-venv/bin/python -m pytest \
            tests/ -v -s
      - name: Upload test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-pdf-rocky-${{ matrix.rocky }}
          path: tests/**/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  test-windows:
    name: Test Windows x86_64
    needs: windows-wheel
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: weasyprint-windows-x86-64
          path: wheelhouse
      - name: Install and test wheel
        shell: pwsh
        run: |
          uv python install $env:TEST_PYTHON_VERSION
          uv venv --python $env:TEST_PYTHON_VERSION .test-venv
          $wheel = Get-ChildItem wheelhouse\weasyprint-*.whl | Select-Object -First 1
          uv pip install --python .test-venv\Scripts\python.exe `
            $wheel.FullName "pytest>=8,<9" "pypdf>=6,<7"
          .test-venv\Scripts\python.exe -m pytest `
            tests -v -s
      - name: Upload test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-pdf-windows
          path: tests/**/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  test-macos:
    name: Test macOS ${{ matrix.arch }}
    needs: macos-wheel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: weasyprint-macos-${{ matrix.arch }}
          path: wheelhouse
      - name: Install wheel
        run: |
          uv python install "${TEST_PYTHON_VERSION}"
          uv venv --python "${TEST_PYTHON_VERSION}" .test-venv
          uv pip install --python .test-venv/bin/python \
            wheelhouse/weasyprint-*.whl "pytest>=8,<9" "pypdf>=6,<7"
      - name: Hide Homebrew runtime and test wheel
        run: |
          for formula in pango cairo fontconfig glib harfbuzz freetype; do
            brew unlink "${formula}" >/dev/null 2>&1 || true
          done
          .test-venv/bin/python -m pytest \
            tests/ -v -s
      - name: Upload test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-pdf-macos-${{ matrix.arch }}
          path: tests/**/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  test-summary:
    name: Wheel test summary
    if: always()
    needs:
      - linux-wheel
      - windows-wheel
      - macos-wheel
      - test-ubuntu
      - test-rocky
      - test-windows
      - test-macos
    runs-on: ubuntu-24.04
    steps:
      - name: Require all builds and tests to pass
        env:
          RESULTS: >-
            ${{ needs.linux-wheel.result }}
            ${{ needs.windows-wheel.result }}
            ${{ needs.macos-wheel.result }}
            ${{ needs.test-ubuntu.result }}
            ${{ needs.test-rocky.result }}
            ${{ needs.test-windows.result }}
            ${{ needs.test-macos.result }}
        run: |
          echo "${RESULTS}"
          for result in ${RESULTS}; do
            test "${result}" = success
          done
