name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      weasyprint_version:
        description: WeasyPrint version used for runtime tests
        required: true
        default: "69.0"
        type: string

permissions:
  contents: read

concurrency:
  group: build-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_WEASYPRINT_VERSION: "69.0"
  TEST_PYTHON_VERSION: "3.13"

jobs:
  linux-wheel:
    name: Linux manylinux_2_28 x86_64 wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require committed uv lock
        shell: bash
        run: |
          test -f uv.lock || {
            echo "uv.lock is missing. Run the Update lockfiles workflow and commit its result." >&2
            exit 1
          }

      - name: Build Manylinux image
        shell: bash
        run: |
          docker build \
            --file containers/Dockerfile.manylinux_2_28 \
            --tag weasyprintlibs-manylinux:ci \
            .

      - name: Build Linux wheel in container
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/io" \
            --workdir /io \
            --env UV_CACHE_DIR=/io/.uv-cache \
            weasyprintlibs-manylinux:ci \
            bash -lc 'uv sync --frozen && make wheel'

      - name: Show generated Linux wheel
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one wheel, got {wheels}")

          with zipfile.ZipFile(wheels[0]) as archive:
              libraries = [
                  name
                  for name in archive.namelist()
                  if name.endswith(".so") or ".so." in name
              ]

          if not libraries:
              raise SystemExit("Linux wheel contains no shared libraries")

          print(f"Wheel contains {len(libraries)} Linux shared libraries")
          PY

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-manylinux-2-28-x86-64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  windows-wheel:
    name: Windows x86_64
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require committed lockfiles
        shell: pwsh
        run: |
          if (-not (Test-Path uv.lock)) {
            throw "uv.lock is missing. Run the Update lockfiles workflow and commit its result."
          }

          if (-not (Test-Path config/windows-packages.lock.toml)) {
            throw "config/windows-packages.lock.toml is missing. Run the Update lockfiles workflow and commit its result."
          }

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build Windows wheel
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Show generated Windows wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist/*.whl)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one wheel, got $($wheels.Count)"
          }
          uv run python -c "import pathlib, zipfile; p=next(pathlib.Path('dist').glob('*.whl')); z=zipfile.ZipFile(p); dlls=[n for n in z.namelist() if n.lower().endswith('.dll')]; print(f'{p} contains {len(dlls)} DLLs'); assert dlls"

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x86-64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  test-ubuntu:
    name: Test Ubuntu 24.04
    needs: linux-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Download Linux wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-manylinux-2-28-x86-64
          path: wheelhouse

      - name: Install wheel and test dependencies
        shell: bash
        env:
          INPUT_WEASYPRINT_VERSION: ${{ inputs.weasyprint_version }}
        run: |
          weasyprint_version="${INPUT_WEASYPRINT_VERSION:-${DEFAULT_WEASYPRINT_VERSION}}"

          uv python install "${TEST_PYTHON_VERSION}"
          uv venv --python "${TEST_PYTHON_VERSION}" .test-venv

          uv pip install \
            --python .test-venv/bin/python \
            wheelhouse/*.whl \
            "weasyprint==${weasyprint_version}" \
            "pytest>=8" \
            "pypdf>=6"

      - name: Run runtime tests
        shell: bash
        run: |
          LD_DEBUG=libs,files \
          LD_DEBUG_OUTPUT=/tmp/weasyprint-loader \
          .test-venv/bin/python -m pytest \
            tests/runtime/test_runtime.py \
            -v \
            -s

          grep -E \
          'lib(pango|pangocairo|pangoft2|harfbuzz|fontconfig|freetype|glib|gobject|gio|ffi|cairo)' \
          /tmp/weasyprint-loader.* |
          sort -u

      - name: Upload Ubuntu test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-pdf-ubuntu-24-04
          path: tests/runtime/_output/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  test-rocky:
    name: Test Rocky Linux ${{ matrix.rocky }}
    needs: linux-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        rocky: ["8", "9"]

    container:
      image: rockylinux:${{ matrix.rocky }}

    steps:
      - name: Install runner prerequisites
        shell: bash
        run: |
          dnf install -y \
            findutils \
            gzip \
            tar \
            dejavu-sans-fonts

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Linux wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-manylinux-2-28-x86-64
          path: wheelhouse

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "/root/.local/bin" >> "$GITHUB_PATH"

      - name: Install wheel and test dependencies
        shell: bash
        env:
          INPUT_WEASYPRINT_VERSION: ${{ inputs.weasyprint_version }}
        run: |
          export PATH="/root/.local/bin:${PATH}"
          weasyprint_version="${INPUT_WEASYPRINT_VERSION:-${DEFAULT_WEASYPRINT_VERSION}}"

          uv python install "${TEST_PYTHON_VERSION}"
          uv venv --python "${TEST_PYTHON_VERSION}" .test-venv

          uv pip install \
            --python .test-venv/bin/python \
            wheelhouse/*.whl \
            "weasyprint==${weasyprint_version}" \
            "pytest>=8" \
            "pypdf>=6"

      - name: Run runtime tests
        shell: bash
        run: |
          LD_DEBUG=libs,files \
          LD_DEBUG_OUTPUT=/tmp/weasyprint-loader \
          .test-venv/bin/python -m pytest \
            tests/runtime/test_runtime.py \
            -v \
            -s

          grep -E \
          'lib(pango|pangocairo|pangoft2|harfbuzz|fontconfig|freetype|glib|gobject|gio|ffi|cairo)' \
          /tmp/weasyprint-loader.* |
          sort -u

      - name: Upload Rocky test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-pdf-rocky-${{ matrix.rocky }}
          path: tests/runtime/_output/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  test-windows:
    name: Test Windows x86_64
    needs: windows-wheel
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Download Windows wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-windows-x86-64
          path: wheelhouse

      - name: Install wheel and test dependencies
        shell: pwsh
        env:
          INPUT_WEASYPRINT_VERSION: ${{ inputs.weasyprint_version }}
        run: |
          $weasyprintVersion = $env:INPUT_WEASYPRINT_VERSION
          if ([string]::IsNullOrWhiteSpace($weasyprintVersion)) {
            $weasyprintVersion = $env:DEFAULT_WEASYPRINT_VERSION
          }

          uv python install $env:TEST_PYTHON_VERSION
          uv venv --python $env:TEST_PYTHON_VERSION .test-venv

          $wheel = Get-ChildItem wheelhouse\*.whl | Select-Object -First 1
          if ($null -eq $wheel) {
            throw "No Windows wheel found in wheelhouse"
          }

          uv pip install `
            --python .test-venv\Scripts\python.exe `
            $wheel.FullName `
            "weasyprint==$weasyprintVersion" `
            "pytest>=8" `
            "pypdf>=6"

      - name: Run runtime tests
        shell: pwsh
        run: |
          .test-venv\Scripts\python.exe `
            -m pytest `
            tests\runtime\test_runtime.py `
            -v `
            -s

      - name: Upload Windows test PDF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-test-pdf-windows
          path: tests/runtime/_output/*.pdf
          if-no-files-found: ignore
          retention-days: 14

  test-summary:
    name: Wheel test summary
    if: always()
    needs:
      - linux-wheel
      - windows-wheel
      - test-ubuntu
      - test-rocky
      - test-windows
    runs-on: ubuntu-24.04

    steps:
      - name: Require all builds and tests to pass
        shell: bash
        env:
          LINUX_WHEEL_RESULT: ${{ needs.linux-wheel.result }}
          WINDOWS_WHEEL_RESULT: ${{ needs.windows-wheel.result }}
          UBUNTU_RESULT: ${{ needs.test-ubuntu.result }}
          ROCKY_RESULT: ${{ needs.test-rocky.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
        run: |
          printf '%-24s %s\n' "Linux wheel" "$LINUX_WHEEL_RESULT"
          printf '%-24s %s\n' "Windows wheel" "$WINDOWS_WHEEL_RESULT"
          printf '%-24s %s\n' "Ubuntu test" "$UBUNTU_RESULT"
          printf '%-24s %s\n' "Rocky tests" "$ROCKY_RESULT"
          printf '%-24s %s\n' "Windows test" "$WINDOWS_RESULT"

          for result in \
            "$LINUX_WHEEL_RESULT" \
            "$WINDOWS_WHEEL_RESULT" \
            "$UBUNTU_RESULT" \
            "$ROCKY_RESULT" \
            "$WINDOWS_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
